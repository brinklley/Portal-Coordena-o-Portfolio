<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relatório do Portfólio · __DATA_CURTA__</title>
<style>
/*__CSS__*/
/* ---- casca do relatório (o resto do estilo é o do próprio portal) ---- */
body{display:block;height:auto;overflow:auto}
.rel{display:flex;min-height:100vh;align-items:stretch}
.rel-nav{width:280px;flex:none;background:#FBFCFC;border-right:1px solid var(--line);padding:20px 14px 28px;position:sticky;top:0;height:100vh;overflow:auto}
.rel-nav h1{font-family:var(--display);font-size:19px;font-weight:650;margin:0 6px 2px;letter-spacing:-.01em}
.rel-nav .meta{font-size:12px;color:var(--ink-2);margin:0 6px 18px;line-height:1.45}
.rel-nav h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:18px 6px 6px;font-weight:650}
.rel-nav a{display:block;padding:7px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:13.5px}
.rel-nav a:hover{background:#EDF0F3}
.rel-nav a.on{background:#E4E8F4;color:var(--ini);font-weight:650}
.rel-nav a small{display:block;font-size:11.5px;color:var(--ink-2);font-weight:400}
.rel-nav .off{display:block;padding:7px 10px;font-size:13.5px;color:var(--ink-3)}
.rel-nav .off small{display:block;font-size:11.5px}
.rel-main{flex:1;min-width:0;background:#fff}
.rel-sec[hidden]{display:none}
.rel-sec .an-title h2{font-size:24px}
.rel .an-table th{cursor:default}
.rel .f4p-real,.rel .an-table .idb,.rel .an-table .idi{cursor:default;text-decoration:none}
@media (max-width:820px){.rel{flex-direction:column}.rel-nav{position:static;width:auto;height:auto;border-right:0;border-bottom:1px solid var(--line)}}
@media print{.rel-nav{display:none}.rel-sec[hidden]{display:block}}
</style>
</head>
<body>
<div class="rel">
<nav class="rel-nav" aria-label="Menu do relatório">
  <h1>Relatório do Portfólio</h1>
  <p class="meta">Gerado em __GERADO_EM__<br>Dados do Azure DevOps · roadmap __ROADMAP__<br><b>Arquivo isolado: funciona offline.</b></p>
__MENU__
</nav>
<main class="rel-main">
__SECOES__
</main>
</div>
<script>
(function(){
  var links = [].slice.call(document.querySelectorAll(".rel-nav a[href^='#']")), secs = [].slice.call(document.querySelectorAll(".rel-sec"));
  function mostrar(){
    var id = (location.hash || "").slice(1) || (secs[0] && secs[0].id);
    if (!secs.some(function(s){ return s.id === id; })) id = secs[0] && secs[0].id;
    secs.forEach(function(s){ s.hidden = s.id !== id; });
    links.forEach(function(a){ a.classList.toggle("on", a.getAttribute("href") === "#" + id); });
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", mostrar); mostrar();
})();
</script>
</body>
</html>
